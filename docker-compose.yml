# НейроМастер в Docker. Запуск одной командой из корня репозитория:
#
#     docker compose up -d
#
# Первый запуск собирает образы (worker с docling — дольше всего) и сам создаёт схему обеих
# БД, ключ шифрования ПДн и учётку владельца (логин и пароль — в логе web).
# Настройки — в необязательном файле .env рядом (образец: .env.example): без него всё
# стартует со значениями по умолчанию. Подробности, бэкапы, обновление — docs/docker.md.
#
#   caddy        — вход снаружи: HTTPS (80/443) -> web
#   web          — API и сайт; схема БД и миграции — при старте
#   worker       — разбор документов и генерация (очередь RQ); процессов внутри — по железу
#
# Число процессов web/worker и пул БД сервер считает сам по ядрам и памяти (backend/sizing.py);
# WEB_CONCURRENCY / NEIROMASTER_RQ_WORKERS / NEIROMASTER_DB_POOL в .env — ручная замена.
#   db-processed — основная БД: всё обработанное + рабочие данные приложения
#   db-raw       — исходники: оригиналы документов и загруженные штатки
#   redis        — очередь задач и общий стейт процессов
#   embed        — векторы вопросов для базы ответов (bge-m3 на CPU, без интернета)
#   llm          — локальная модель для офлайн-режима (профиль offline, см. docs/offline.md):
#                  docker compose --profile offline up -d

name: neiromaster

x-logging: &logging
  driver: json-file
  options: {max-size: "10m", max-file: "5"}

x-app: &app
  env_file:
    - path: .env
      required: false
  environment:
    # Адреса служб задаются здесь и перекрывают .env (там могут быть localhost-адреса
    # для запуска без Docker).
    NEIROMASTER_DB_DSN: postgresql://neiromaster:${POSTGRES_PROCESSED_PASSWORD:-neiromaster}@db-processed:5432/neiromaster
    NEIROMASTER_RAW_DB_DSN: postgresql://neiromaster_raw:${POSTGRES_RAW_PASSWORD:-neiromaster_raw}@db-raw:5432/neiromaster_raw
    REDIS_URL: redis://redis:6379/0
    NEIROMASTER_EMBED_URL: http://embed:8080
    NEIROMASTER_LOCAL_LLM_URL: http://llm:8080
  volumes:
    - documents:/app/data/documents          # локальный кэш оригиналов (источник правды — db-raw)
    - converted:/app/data/converted
    - parse-cache:/app/data/processed
    - secrets:/app/data/secrets              # ключ ПДн, ключ Firebase: бэкапить ОТДЕЛЬНО от дампов БД
    - app-files:/app/data/app                # APK приложения для страницы /app
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]
  logging: *logging
  networks: [backend]

services:
  web:
    <<: *app
    build: {context: ., target: web}
    image: neiromaster-web:${IMAGE_TAG:-latest}
    networks: [backend, edge]
    depends_on:
      db-processed: {condition: service_healthy}
      db-raw: {condition: service_healthy}
      redis: {condition: service_healthy}

  worker:
    <<: *app
    build: {context: ., target: worker}
    image: neiromaster-worker:${IMAGE_TAG:-latest}
    volumes:
      - documents:/app/data/documents
      - converted:/app/data/converted
      - parse-cache:/app/data/processed
      - secrets:/app/data/secrets
      - models:/app/.cache                   # модели docling/EasyOCR — скачиваются один раз
    deploy:
      replicas: ${WORKER_REPLICAS:-1}      # процессов внутри — по железу (sizing.py)
    depends_on:
      # web создаёт схему БД под замком — worker стартует после него, без гонки миграций.
      web: {condition: service_healthy}

  # Векторы вопросов для базы ответов: похожий по смыслу вопрос получает готовый ответ.
  # Модель (bge-m3, ~600 МБ) скачивается при первом старте в том models-llm; дальше — офлайн.
  embed:
    image: ghcr.io/ggml-org/llama.cpp:server
    restart: unless-stopped
    environment:
      LLAMA_CACHE: /models
    command: ["-hf", "ggml-org/bge-m3-Q8_0-GGUF", "--embeddings", "-c", "2048", "-ub", "2048",
              "--host", "0.0.0.0", "--port", "8080", "-t", "${EMBED_THREADS:--1}"]   # -1 — по числу ядер
    volumes: [models-llm:/models]
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 30s
    security_opt: ["no-new-privileges:true"]
    logging: *logging
    networks: [backend]

  # Локальная модель для офлайн-режима (NEIROMASTER_LLM_MODE=offline): отвечает на вопросы,
  # которых нет в базе готовых ответов. Модель (GGUF) скачивается при первом старте —
  # запустите профиль, пока есть интернет. Один запрос за раз: CPU не делится, очередь
  # держит сервер. Модель и потоки — LLM_MODEL / LLM_THREADS в .env.
  llm:
    profiles: ["offline"]
    image: ghcr.io/ggml-org/llama.cpp:server
    restart: unless-stopped
    environment:
      LLAMA_CACHE: /models
    command: ["-hf", "${LLM_MODEL:-unsloth/Qwen3-4B-Instruct-2507-GGUF:Q4_K_M}", "-c", "4096",
              "--parallel", "1", "-t", "${LLM_THREADS:--1}", "--host", "0.0.0.0", "--port", "8080"]
    volumes: [models-llm:/models]
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 90
      start_period: 60s
    security_opt: ["no-new-privileges:true"]
    logging: *logging
    networks: [backend]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      # Домен — сертификат Let's Encrypt (нужен интернет); IP-адрес или localhost —
      # сертификат внутреннего CA Caddy (работает в закрытом контуре).
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    security_opt: ["no-new-privileges:true"]
    logging: *logging
    networks: [edge]
    depends_on:
      web: {condition: service_healthy}

  db-processed:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: neiromaster
      POSTGRES_PASSWORD: ${POSTGRES_PROCESSED_PASSWORD:-neiromaster}
      POSTGRES_DB: neiromaster
    # (web + RQ-процессы) * пул; пул sizing.py делит 80% этого числа на процессы.
    command: ["postgres", "-c", "max_connections=300"]
    volumes: [pg-processed:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neiromaster -d neiromaster"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging: *logging
    networks: [backend]

  db-raw:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: neiromaster_raw
      POSTGRES_PASSWORD: ${POSTGRES_RAW_PASSWORD:-neiromaster_raw}
      POSTGRES_DB: neiromaster_raw
    volumes: [pg-raw:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neiromaster_raw -d neiromaster_raw"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging: *logging
    networks: [backend]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # AOF: очередь задач переживает перезапуск контейнера.
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redis:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *logging
    networks: [backend]

# Порты наружу — только у caddy. БД и Redis доступны лишь внутри сети backend.
networks:
  backend:
  edge:

volumes:
  pg-processed:
  pg-raw:
  redis:
  documents:
  converted:
  parse-cache:
  secrets:
  app-files:
  models:
  models-llm:
  caddy-data:
  caddy-config:
